
#user  nobody;
worker_processes 1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;
events {
  worker_connections 1024;
}


http {
  include mime.types;
  fastcgi_intercept_errors on;
  default_type application/octet-stream;

  #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
  #                  '$status $body_bytes_sent "$http_referer" '
  #                  '"$http_user_agent" "$http_x_forwarded_for"';

  #access_log  logs/access.log  main;
  sendfile on;
  #tcp_nopush     on;

  #keepalive_timeout  0;
  keepalive_timeout 65;

  gzip on;


  server {
    listen 80;
    server_name shenzhiyong.com.cn shenzhiyong.com;
    if ($scheme = http ) {
      return 301 https://$host$request_uri;
    }

    #charset koi8-r;

    #access_log  logs/host.access.log  main;
    error_page 404 /404.html;
    location /404.html {
      root html;
    }

    location / {
      #http 重定向到https
      #            rewrite ^(.*)$ https://${server_name}$1 permanent;
      root html;
      index index.html index.htm;
    }

    # redirect server error pages to the static page /50x.html
    #
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
      root html;
    }


    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}
    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}
    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
  }


  server {
    listen 2000;
    server_name localhost;
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Credentials' 'true';
    location / {
      root /usr/local/nginx/lingxu/DSIP/;
      index index.html index.htm;
      try_files $uri $uri/ /index.html;
    }

    location /api {
      # 代理到其他接口的地址，请替换成您期望的目标地址
      proxy_pass http://112.80.57.227:4006;
      # 可以添加其他代理相关的配置，如需修改请求头等
      # proxy_set_header Host $host;
      # proxy_set_header X-Real-IP $remote_addr;
      # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }


  # another virtual host using mix of IP-, name-, and port-based configuration
  #
  #server {
  #    listen       8000;
  #    listen       somename:8080;
  #    server_name  somename  alias  another.alias;
  #    location / {
  #        root   html;
  #        index  index.html index.htm;
  #    }
  #}
  # HTTPS server
  #
  server {
    listen 443 ssl;
    server_name shenzhiyong.com;

    ssl_certificate /root/.acme.sh/shenzhiyong.com/shenzhiyong.com.cer;
    ssl_certificate_key /root/.acme.sh/shenzhiyong.com/shenzhiyong.com.key;

    error_page 404 /404.html;
    location /404.html {
      root html;

    }
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 5m;

    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
      tcp_nodelay on;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      #以上三行，目的是将代理服务器收到的用户的信息传到真实服务器上


      root html;
      index index.html index.htm;
    }
  }

  server {
    listen 443 ssl;
    server_name shenzhiyong.com.cn;

    ssl_certificate /root/.acme.sh/shenzhiyong.com.cn/shenzhiyong.com.cn.cer;
    ssl_certificate_key /root/.acme.sh/shenzhiyong.com.cn/shenzhiyong.com.cn.key;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 5m;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    if ($http_host ~* "^(.*?)\.shenzhiyong\.com\.cn$") {
      set $domain $1; #设置变量
    }

    location / {
      # if ($domain ~* "yousu") {
      #   proxy_pass http://124.221.252.113:19009;
      # }

      if ($domain ~* "dsip") {
        proxy_pass http://shenzhiyong.com.cn:2000;
      }

      tcp_nodelay on;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      #以上三行，目的是将代理服务器收到的用户的信息传到真实服务器上
      root html;
      index index.html index.htm;
    }

    location /demo {
      proxy_pass http://dtw.tradingworks.com.cn:8888/demo;
    }

    #    location /api {
    #      proxy_pass https://2021.tradingworks.com.cn/api;
    #    }

    location /api/app {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://47.96.173.202:9050/api/app;
    }

    location /ido {
      proxy_pass http://119.23.148.17:8391/ido;
    }

    location /admin {
      proxy_pass http://119.23.148.17:8391/admin;
    }


    location /oa {
      proxy_pass http://112.80.57.228:11457/oa;
    }

    location /profile {
      proxy_pass http://127.0.0.1:8088/down;
    }

    location /yousu {
      proxy_pass http://124.221.252.113:19009;
    }
    location /commons {
      proxy_pass http://jyds-1254096183.cos.ap-beijing.myqcloud.com/commons;
    }
  }


